<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Absolute ADAS Email Signature Template</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; background: #f4f4f4; color: #2a2a2a; margin: 0; padding: 32px 16px; }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { color: #666; margin: 0 0 24px; font-size: 14px; }
  .card { background: #fff; border-radius: 8px; padding: 24px; margin-bottom: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: #888; margin: 0 0 16px; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  label { display: block; font-size: 12px; color: #666; margin-bottom: 4px; }
  input { width: 100%; box-sizing: border-box; padding: 9px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
  input:focus { outline: 2px solid #cd4419; border-color: #cd4419; }
  .preview { overflow-x: auto; padding: 8px 0; }
  .buttons { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
  button { background: #cd4419; color: #fff; border: 0; border-radius: 6px; padding: 10px 16px; font-size: 14px; font-weight: bold; cursor: pointer; }
  button.secondary { background: #2a2a2a; }
  button:hover { opacity: .9; }
  textarea { width: 100%; box-sizing: border-box; height: 190px; font-family: Menlo, Consolas, monospace; font-size: 12px; border: 1px solid #ccc; border-radius: 6px; padding: 10px; }
  #status { font-size: 13px; color: #2e7d32; align-self: center; }
  @media (max-width: 560px) { .fields { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Absolute ADAS Email Signature</h1>
  <p class="sub">Leave the fields as-is for the Zoho organization template, or fill them in to make one person's signature.</p>

  <div class="card">
    <h2>Details</h2>
    <div class="fields">
      <div><label for="f-name">Full name</label><input id="f-name" value="{{ Name }}"></div>
      <div><label for="f-title">Job title</label><input id="f-title" value="{{ Designation }}"></div>
      <div><label for="f-email">Email</label><input id="f-email" value="{{ Email Address }}"></div>
      <div><label for="f-phone">Phone</label><input id="f-phone" value="1-844-FIX-ADAS"></div>
    </div>
  </div>

  <div class="card">
    <h2>Preview</h2>
    <div class="preview" id="preview"></div>
    <div class="buttons">
      <button id="copy-sig">Copy signature</button>
      <button id="copy-html" class="secondary">Copy HTML</button>
      <span id="status"></span>
    </div>
  </div>

  <div class="card">
    <h2>HTML</h2>
    <textarea id="html" readonly></textarea>
  </div>
</div>

<script>
  var LOGO = 'https://absoluteadas.com/images/signature-logo.png';
  var RED = '#cd4419';

  function esc(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function build(d, logo) {
    var font = "font-family:Arial,Helvetica,sans-serif;";
    return '' +
'<table cellpadding="0" cellspacing="0" border="0" style="' + font + 'border-collapse:collapse;">\n' +
'  <tr>\n' +
'    <td style="padding:0 28px 0 16px;vertical-align:middle;">\n' +
'      <a href="https://www.absoluteadas.com" style="text-decoration:none;"><img src="' + logo + '" width="92" height="91" alt="Absolute ADAS" style="display:block;border:0;"></a>\n' +
'    </td>\n' +
'    <td style="border-left:2px solid ' + RED + ';padding:2px 0 2px 14px;vertical-align:middle;' + font + 'font-size:14px;line-height:19px;color:#2a2a2a;">\n' +
'      <span style="font-size:15px;font-weight:bold;color:' + RED + ';">' + esc(d.name) + '</span><br>\n' +
'      <span style="color:#2a2a2a;">' + esc(d.title) + '</span><br>\n' +
'      <span style="font-size:15px;font-weight:bold;color:' + RED + ';">Absolute ADAS</span><br>\n' +
'      ' + emailHtml(d.email) + ' | <span style="color:#2a2a2a;">' + esc(d.phone) + '</span><br>\n' +
'      <a href="https://www.absoluteadas.com" style="color:' + RED + ';text-decoration:none;">www.absoluteadas.com</a><br>\n' +
'      <span style="font-size:12px;color:#777777;">Driving Safety forward, one calibration at a time</span>\n' +
'    </td>\n' +
'  </tr>\n' +
'</table>';
  }

  // Only link the address when it is a real one, so a placeholder stays plain text.
  function emailHtml(email) {
    if (/^[^\s@{}\[\]]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      return '<a href="mailto:' + esc(email) + '" style="color:#2a2a2a;text-decoration:none;">' + esc(email) + '</a>';
    }
    return '<span style="color:#2a2a2a;">' + esc(email) + '</span>';
  }

  function data() {
    return {
      name: document.getElementById('f-name').value,
      title: document.getElementById('f-title').value,
      email: document.getElementById('f-email').value,
      phone: document.getElementById('f-phone').value
    };
  }

  function render() {
    var html = build(data(), LOGO);
    document.getElementById('html').value = html;
    // Preview uses the local copy of the logo so it shows before the site is deployed.
    document.getElementById('preview').innerHTML = build(data(), 'images/signature-logo.png');
  }

  function flash(msg) {
    var s = document.getElementById('status');
    s.textContent = msg;
    setTimeout(function () { s.textContent = ''; }, 2500);
  }

  document.querySelectorAll('input').forEach(function (i) { i.addEventListener('input', render); });

  document.getElementById('copy-html').addEventListener('click', function () {
    navigator.clipboard.writeText(document.getElementById('html').value).then(function () { flash('HTML copied'); });
  });

  document.getElementById('copy-sig').addEventListener('click', function () {
    var html = document.getElementById('html').value;
    var item = new ClipboardItem({
      'text/html': new Blob([html], { type: 'text/html' }),
      'text/plain': new Blob([html], { type: 'text/plain' })
    });
    navigator.clipboard.write([item]).then(function () { flash('Signature copied — paste it into your mail settings'); });
  });

  render();
</script>
</body>
</html>
