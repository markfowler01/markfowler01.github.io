name: PARKED FM music lab

# Experiments for the music creator: find free recorded-instrument libraries (SFZ format) whose
# licences allow commercial use, and render short samples with them for listening. Run by hand;
# nothing here posts to YouTube.
on:
  workflow_dispatch:
    inputs:
      task:
        description: "discover = list instrument libraries and their licences; sample = render a test song"
        type: choice
        options: [discover, inspect, explore, sample]
        default: discover
      repos:
        description: "inspect: sfzinstruments repo names, space-separated"
        type: string
        default: "Osiris_Piano karoryfer.sneakybass virtuosity_drums karoryfer.emilyguitar jlearman.jRhodes3c"
      cmd:
        description: "explore: bash run inside /tmp/libs after the repos are cloned (no samples fetched unless the command reads them)"
        type: string
        default: "ls"

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: List free instrument libraries and their licences
        if: ${{ inputs.task == 'discover' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate orgs/sfzinstruments/repos \
            --jq '.[] | "\(.name)\t\(.license.spdx_id // "none")\t\(.size)KB\t\(.description // "")"' | sort

      - name: Show how each instrument library is laid out (no samples downloaded)
        if: ${{ inputs.task == 'inspect' }}
        run: |
          for r in ${{ inputs.repos }}; do
            echo "=================== $r"
            git clone -q --filter=blob:none --no-checkout --depth 1 "https://github.com/sfzinstruments/$r" "/tmp/$r"
            cd "/tmp/$r"
            echo "--- files: $(git ls-tree -r --name-only HEAD | wc -l) total; by extension:"
            git ls-tree -r --name-only HEAD | sed 's/.*\.//' | sort | uniq -c | sort -rn | head
            echo "--- folders:"
            git ls-tree -r -d --name-only HEAD | head -30
            echo "--- licence / readme:"
            for f in $(git ls-tree --name-only HEAD | grep -iE '^(licen|copying|readme)' | head -3); do echo "## $f"; git show "HEAD:$f" | head -25; done
            echo "--- sfz files:"
            git ls-tree -r --name-only HEAD | grep -iE '\.sfz$' | head -20
            for f in $(git ls-tree -r --name-only HEAD | grep -iE '\.(sfz|sfzh)$' | head -4); do echo "## $f"; git show "HEAD:$f" | head -60; done
            echo "--- sample names:"
            git ls-tree -r --name-only HEAD | grep -iE '\.(wav|flac|ogg)$' | head -25
            cd - >/dev/null
          done

      - name: Explore the instrument libraries
        if: ${{ inputs.task == 'explore' }}
        env:
          CMD: ${{ inputs.cmd }}
        run: |
          mkdir -p /tmp/libs && cd /tmp/libs
          for r in ${{ inputs.repos }}; do
            git clone -q --filter=blob:none --no-checkout --depth 1 "https://github.com/sfzinstruments/$r" "$r"
          done
          bash -c "$CMD" 2>&1 | head -c 60000
