name: PARKED FM music lab

# Experiments for the music creator: find free recorded-instrument libraries (SFZ format) whose
# licences allow commercial use, and render short samples with them for listening. Run by hand;
# nothing here posts to YouTube.
on:
  workflow_dispatch:
    inputs:
      task:
        description: "discover = list instrument libraries and their licences; sample = render a test song; kit = build a full music-day kit (nothing posted); youtube = check the YouTube sign-in can read analytics; rooms = paint one picture in each room (nothing posted)"
        type: choice
        options: [discover, inspect, explore, sample, kit, youtube, rooms]
        default: discover
      repos:
        description: "inspect: sfzinstruments repo names, space-separated"
        type: string
        default: "Osiris_Piano karoryfer.sneakybass virtuosity_drums karoryfer.emilyguitar jlearman.jRhodes3c"
      cmd:
        description: "explore: bash run inside /tmp/libs after the repos are cloned (no samples fetched unless the command reads them)"
        type: string
        default: "ls"
      seed:
        description: "sample: song seed (different number = different songs)"
        type: string
        default: "1"
      minutes:
        description: "sample: length in minutes"
        type: string
        default: "4"
      style:
        description: "sample: lofi (lo-fi hip hop), garage (future garage / chillstep) or house (lo-fi house)"
        type: choice
        options: [lofi, garage, house]
        default: lofi

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: List free instrument libraries and their licences
        if: ${{ inputs.task == 'discover' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate orgs/sfzinstruments/repos \
            --jq '.[] | "\(.name)\t\(.license.spdx_id // "none")\t\(.size)KB\t\(.description // "")"' | sort

      - name: Show how each instrument library is laid out (no samples downloaded)
        if: ${{ inputs.task == 'inspect' }}
        run: |
          for r in ${{ inputs.repos }}; do
            echo "=================== $r"
            git clone -q --filter=blob:none --no-checkout --depth 1 "https://github.com/sfzinstruments/$r" "/tmp/$r"
            cd "/tmp/$r"
            echo "--- files: $(git ls-tree -r --name-only HEAD | wc -l) total; by extension:"
            git ls-tree -r --name-only HEAD | sed 's/.*\.//' | sort | uniq -c | sort -rn | head
            echo "--- folders:"
            git ls-tree -r -d --name-only HEAD | head -30
            echo "--- licence / readme:"
            for f in $(git ls-tree --name-only HEAD | grep -iE '^(licen|copying|readme)' | head -3); do echo "## $f"; git show "HEAD:$f" | head -25; done
            echo "--- sfz files:"
            git ls-tree -r --name-only HEAD | grep -iE '\.sfz$' | head -20
            for f in $(git ls-tree -r --name-only HEAD | grep -iE '\.(sfz|sfzh)$' | head -4); do echo "## $f"; git show "HEAD:$f" | head -60; done
            echo "--- sample names:"
            git ls-tree -r --name-only HEAD | grep -iE '\.(wav|flac|ogg)$' | head -25
            cd - >/dev/null
          done

      - name: Explore the instrument libraries
        if: ${{ inputs.task == 'explore' }}
        env:
          CMD: ${{ inputs.cmd }}
        run: |
          mkdir -p /tmp/libs && cd /tmp/libs
          for r in ${{ inputs.repos }}; do
            git clone -q --filter=blob:none --no-checkout --depth 1 "https://github.com/sfzinstruments/$r" "$r"
          done
          bash -c "$CMD" 2>&1 | head -c 60000

      - uses: actions/setup-python@v5
        if: ${{ inputs.task == 'sample' || inputs.task == 'kit' }}
        with:
          python-version: '3.12'

      - name: Render a test album on real instruments
        if: ${{ inputs.task == 'sample' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install -q numpy Pillow imageio-ffmpeg
          mkdir -p lab
          python garage-tv/make_lofi_real.py --minutes "${{ inputs.minutes }}" --seed "${{ inputs.seed }}" --style "${{ inputs.style }}" --out lab/sample.m4a
          FF=$(python -c "import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())")
          name="parked-fm-${{ inputs.style }}-seed${{ inputs.seed }}.mp3"
          cat lab/sample.tracks.json
          "$FF" -y -loglevel error -i lab/sample.m4a -c:a libmp3lame -b:a 192k "lab/$name"
          tag="music-lab-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$tag" "lab/$name" --prerelease --title "Music lab: ${{ inputs.style }}, seed ${{ inputs.seed }}" --notes "Test render only; nothing was posted."
          echo "https://github.com/${{ github.repository }}/releases/download/$tag/$name"

      - name: Build a full music-day kit exactly like the daily job, without posting or logging it
        if: ${{ inputs.task == 'kit' }}
        env:
          STYLE: ${{ inputs.style }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          pip install -q numpy Pillow imageio-ffmpeg
          cd garage-tv
          # tomorrow's pick, re-labelled as a music day in the chosen style, on the newest photo
          python - <<'PY'
          import datetime as dt, glob, json, os, shutil
          import car_engine as ce
          pub = json.load(open("published.json"))
          choice = ce.pick(dt.date.today() + dt.timedelta(days=1), pub)
          choice.update(sound="lofi", music_style=os.environ["STYLE"])
          photo = max(glob.glob("stills/*.webp"), key=os.path.getmtime)
          shutil.copy(photo, "stills/2099-01-01-lab-test.webp")
          json.dump(ce.with_written_intro(choice, ce.sidecar(choice)), open("stills/2099-01-01-lab-test.json", "w"), indent=2)
          PY
          start=$(date +%s)
          python weekly.py --daily --date 2099-01-01 --outdir ../kit
          echo "build took $(( ($(date +%s) - start) / 60 )) minutes"
          cat ../kit/details.txt

      - name: Check the YouTube sign-in can read the channel's analytics (nothing posted)
        if: ${{ inputs.task == 'youtube' }}
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          cd garage-tv
          python3 -c "
          import scoreboard
          r = scoreboard.analytics()
          if not r:
              raise SystemExit('analytics permission missing: run get_youtube_token.py --renew and tick both boxes')
          hours, subs = r
          print(f'analytics OK: {hours} watch hours in the last 12 months; subscribers gained by video: {subs}')
          "

      - uses: actions/setup-python@v5
        if: ${{ inputs.task == 'rooms' }}
        with:
          python-version: '3.12'

      - name: Paint one picture in each room (nothing posted)
        if: ${{ inputs.task == 'rooms' }}
        env:
          ROOMS: ${{ inputs.cmd != 'ls' && inputs.cmd || '' }}
          SEED: ${{ inputs.seed }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install -q Pillow numpy
          mkdir -p lab
          cd garage-tv
          python - <<'PY'
          import os
          import random
          import car_engine as ce
          rng = random.Random(int(os.environ.get("SEED", "7")))
          rooms = os.environ.get("ROOMS", "").split() or list(ce.ROOMS)
          for room in rooms:
              sc = rng.choice([s for s in ce.SCENES if s["room"] == room])
              car = rng.choice(ce.CARS)[0]
              prompt = ce.prompt_for(sc, rng.choice(ce.COLORS), car)
              out = f"../lab/{sc['id']}.webp"
              maker = ce.generate(prompt, out, "gemini")
              print(room, sc["id"], car, "painted by", maker)
          PY
          tag="music-lab-rooms-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$tag" ../lab/*.webp --prerelease --title "Lab: the PARKED FM rooms" --notes "Test pictures only; nothing was posted."
