name: PARKED FM daily video

# Every morning: have the car engine paint a new car photo with Nano Banana (GEMINI_API_KEY)
# or OpenAI's image model (OPENAI_API_KEY) when a key is set, otherwise take the next photo from garage-tv/stills or reuse the
# oldest one; compose 30 minutes of white noise with occasional original lo-fi,
# build the video loop, thumbnail, title and description, and publish it all as a release.
# With the YT_* secrets set it also builds the 8-hour file and uploads it to YouTube.
on:
  schedule:
    - cron: '23 13 * * *'   # every day 13:23 UTC = 6:23 am Pacific (5:23 am in winter)
  workflow_dispatch:         # "Run workflow" button for an extra video

concurrency: car-people-sleep-daily

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tools
        run: |
          sudo apt-get install -y -qq fonts-dejavu-core >/dev/null
          pip install numpy Pillow imageio-ffmpeg

      - name: Paint today's car (Nano Banana or OpenAI)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ] || [ -n "$OPENAI_API_KEY" ]; then
            python garage-tv/car_engine.py || echo "::warning::car engine failed; using the photo queue today"
          else
            echo "No GEMINI_API_KEY or OPENAI_API_KEY secret; using the photo queue"
          fi

      - name: Build today's kit
        env:
          HAS_YT: ${{ secrets.YT_REFRESH_TOKEN != '' }}
        run: |
          args="--daily --record --outdir kit"
          [ "$HAS_YT" = "true" ] && args="$args --full"
          python garage-tv/weekly.py $args

      - name: Publish the kit as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(cat kit/TAG)
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" kit/*.zip kit/thumbnail.jpg kit/trailer.mp4 \
            --title "$(cat kit/RELEASE_TITLE)" --notes-file kit/details.txt

      - name: Save today's photo and log it as used
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add garage-tv/published.json garage-tv/stills
          git diff --staged --quiet || (git commit -m "Car People Sleep: log $(cat kit/TAG)" && git pull --rebase && git push)

      - name: Remove kits older than 21 days
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cutoff=$(date -u -d '21 days ago' +%Y-%m-%d)
          gh release list --limit 200 --json tagName,createdAt \
            --jq ".[] | select(.tagName | startswith(\"daily-\")) | select(.createdAt < \"$cutoff\") | .tagName" |
          while read -r t; do gh release delete "$t" --yes --cleanup-tag; done

      - name: Upload to YouTube
        if: ${{ hashFiles('kit/parked-fm-full.mp4') != '' }}
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'public' }}
        run: |
          python garage-tv/youtube_upload.py kit/parked-fm-full.mp4 kit/thumbnail.jpg kit/details.json --id-file kit/video_id.txt
          python garage-tv/youtube_upload.py kit/trailer.mp4 - kit/details.json --short --full-id "$(cat kit/video_id.txt)"
