name: PARKED FM daily video

# Every morning: the car engine picks an exotic car and scene and has it painted, rotating a
# picture test (Nano Banana photo / ChatGPT photo / Sora moving clip) when both GEMINI_API_KEY and
# OPENAI_API_KEY are set; otherwise it uses whichever key exists, or the next photo in garage-tv/stills.
# Days alternate between original lo-fi (music only) and a soundscape (rain, wind, brown or white
# noise, no music). Builds the loop, thumbnail, title, description and trailer, publishes a release,
# and with the YT_* secrets uploads the full video and the Short to YouTube. With YT_API_KEY it also
# refreshes the view-count scoreboard at absoluteadas.com/parked-fm/scoreboard.
on:
  schedule:
    - cron: '23 13 * * *'   # every day 13:23 UTC = 6:23 am Pacific (5:23 am in winter)
  workflow_dispatch:         # "Run workflow" button for an extra video
    inputs:
      maker:
        description: "Who paints the picture (auto = the picture-test rotation)"
        type: choice
        options: [auto, gemini, openai, sora]
        default: auto

concurrency: car-people-sleep-daily

env:
  # last day the music library's licence covers new videos (e.g. the Epidemic Sound trial's
  # end); after it, music days switch off and every day is a soundscape. Empty = no limit.
  MUSIC_UNTIL: ${{ vars.MUSIC_UNTIL }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tools
        run: |
          # the 8-hour file can pass 10 GB; drop preinstalled SDKs this job never uses
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
          sudo apt-get install -y -qq fonts-dejavu-core >/dev/null
          pip install numpy Pillow imageio-ffmpeg

      - name: Paint today's car (Nano Banana, ChatGPT or Sora)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SORA_MODEL: ${{ vars.SORA_MODEL }}
          MAKER: ${{ inputs.maker }}
        run: |
          if [ -n "$GEMINI_API_KEY" ] || [ -n "$OPENAI_API_KEY" ]; then
            python garage-tv/car_engine.py || echo "::warning::car engine failed; using the photo queue today"
          else
            echo "No GEMINI_API_KEY or OPENAI_API_KEY secret; using the photo queue"
          fi

      - name: Build today's kit
        env:
          HAS_YT: ${{ secrets.YT_REFRESH_TOKEN != '' }}
        run: |
          args="--daily --record --outdir kit"
          [ "$HAS_YT" = "true" ] && args="$args --full"
          python garage-tv/weekly.py $args

      - name: Publish the kit as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(cat kit/TAG)
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" kit/*.zip kit/thumbnail.jpg kit/trailer.mp4 \
            --title "$(cat kit/RELEASE_TITLE)" --notes-file kit/details.txt

      - name: Save today's photo and log it as used
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add garage-tv/published.json garage-tv/stills
          git diff --staged --quiet || (git commit -m "PARKED FM: log $(cat kit/TAG)" && git pull --rebase && git push)

      - name: Remove kits older than 21 days
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cutoff=$(date -u -d '21 days ago' +%Y-%m-%d)
          gh release list --limit 200 --json tagName,createdAt \
            --jq ".[] | select(.tagName | startswith(\"daily-\")) | select(.createdAt < \"$cutoff\") | .tagName" |
          while read -r t; do gh release delete "$t" --yes --cleanup-tag; done

      - name: Upload to YouTube
        if: ${{ hashFiles('kit/parked-fm-full.mp4') != '' }}
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'public' }}
        run: |
          python garage-tv/youtube_upload.py kit/parked-fm-full.mp4 kit/thumbnail.jpg kit/details.json --id-file kit/video_id.txt
          python garage-tv/youtube_upload.py kit/trailer.mp4 - kit/details.json --short --full-id "$(cat kit/video_id.txt)" --id-file kit/short_id.txt
          python garage-tv/scoreboard.py --log "$(cat kit/TAG)" "$(cat kit/video_id.txt)" "$(cat kit/short_id.txt)"

      - name: Update the picture-test scoreboard
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: |
          python garage-tv/scoreboard.py || echo "::warning::scoreboard refresh failed"
          git add garage-tv/published.json parked-fm/scoreboard.json
          git diff --staged --quiet || (git commit -m "PARKED FM: scoreboard $(cat kit/TAG)" && git pull --rebase && git push)
