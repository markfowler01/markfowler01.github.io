name: PARKED FM daily video

# Every morning: the car engine picks an exotic car and scene and has it painted, rotating a
# picture test (Nano Banana photo / ChatGPT photo / Sora moving clip) when both GEMINI_API_KEY and
# OPENAI_API_KEY are set; otherwise it uses whichever key exists, or the next photo in garage-tv/stills.
# Days alternate between original lo-fi (music only) and a soundscape (rain, wind, brown or white
# noise, no music). Builds the loop, thumbnail, title, description and trailer, publishes a release,
# and with the YT_* secrets uploads the full video and the Short to YouTube. With YT_API_KEY it also
# refreshes the view-count scoreboard at absoluteadas.com/parked-fm/scoreboard.
on:
  # The video goes public at 8:00 am Eastern and the second Short at 4:00 pm Eastern (uploaded
  # early and scheduled on YouTube). The build starts from a Claude scheduled task at 5:37 am
  # Eastern with only_if_missing. GitHub's own free scheduler starts runs hours late (3-6 h in
  # October 2026) and sometimes drops them, so these times are only backups: whichever run starts
  # first posts the day's video and the rest see it in published.json and stand down. A late run
  # posts right away.
  schedule:
    - cron: '23 9 * * *'    # 9:23 UTC = 4:23 am Eastern in winter (5:23 in summer)
    - cron: '41 11 * * *'   # backup
    - cron: '7 14 * * *'    # backup
    - cron: '53 17 * * *'   # backup
  workflow_dispatch:         # "Run workflow" button for an extra video
    inputs:
      maker:
        description: "Who paints the picture (auto = the picture-test rotation)"
        type: choice
        options: [auto, gemini, openai, sora]
        default: auto
      preview:
        description: "Preview only: paint the picture and attach it to a 'preview' release; build and post nothing"
        type: boolean
        default: false
      sound:
        description: "auto = days alternate; music or soundscape forces one for this run"
        type: choice
        options: [auto, music, soundscape]
        default: auto
      only_if_missing:
        description: "Skip if today's video is already up (the on-time starter sets this)"
        type: boolean
        default: false

concurrency: car-people-sleep-daily

env:
  # last day the music library's licence covers new videos (e.g. the Epidemic Sound trial's
  # end); after it, music days switch off and every day is a soundscape. Empty = no limit.
  MUSIC_UNTIL: ${{ vars.MUSIC_UNTIL }}

jobs:
  # Several starters can fire on one day (the on-time starter, GitHub's late schedule, a backup);
  # the first posts the video and the rest stand down instead of posting twice. Plain manual runs
  # always go ahead.
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.today.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: garage-tv/published.json
          sparse-checkout-cone-mode: false
      - id: today
        run: |
          skip=false
          if { [ "${{ github.event_name }}" = schedule ] || [ "${{ inputs.only_if_missing }}" = true ]; } && python3 -c "
          import datetime, json, sys
          log = json.load(open('garage-tv/published.json'))
          sys.exit(0 if any(e.get('date') == datetime.date.today().isoformat() for e in log) else 1)"; then
            skip=true
            echo "::notice::Today's video is already up; this run stands down."
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tools
        run: |
          # the 8-hour file can pass 10 GB; drop preinstalled SDKs this job never uses
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
          sudo apt-get install -y -qq fonts-dejavu-core >/dev/null
          pip install numpy Pillow imageio-ffmpeg

      - name: Paint today's car (Nano Banana, ChatGPT or Sora)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SORA_MODEL: ${{ vars.SORA_MODEL }}
          MAKER: ${{ inputs.maker }}
          FORCE_SOUND: ${{ inputs.sound }}
        run: |
          if [ -n "$GEMINI_API_KEY" ] || [ -n "$OPENAI_API_KEY" ]; then
            python garage-tv/car_engine.py || echo "::warning::car engine failed; using the photo queue today"
          else
            echo "No GEMINI_API_KEY or OPENAI_API_KEY secret; using the photo queue"
          fi

      - name: Preview the picture (preview runs only)
        if: ${{ inputs.preview }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pic=$(git ls-files --others --exclude-standard garage-tv/stills | grep -E '\.(webp|png|jpg)$' | head -1)
          [ -n "$pic" ] || { echo "::error::no new picture was painted"; exit 1; }
          tag="preview-$(date -u +%Y%m%d-%H%M%S)"
          extra=(); off="garage-tv/stills/off/$(basename "$pic")"; [ -f "$off" ] && cp "$off" "lights-off-$(basename "$pic")" && extra=("lights-off-$(basename "$pic")")
          gh release create "$tag" "$pic" "${pic%.*}.json" "${extra[@]}" --prerelease --title "Preview: $(basename "$pic")" --notes "Picture preview only; nothing was posted."
          echo "https://github.com/${{ github.repository }}/releases/download/$tag/$(basename "$pic")"

      - name: Keep the instrument recordings between runs
        if: ${{ !inputs.preview }}
        uses: actions/cache@v4
        with:
          path: garage-tv/out/instruments
          key: sfz-instruments-v1

      - name: Build today's kit
        if: ${{ !inputs.preview }}
        env:
          HAS_YT: ${{ secrets.YT_REFRESH_TOKEN != '' }}
          SECOND_SHORT: "1"  # the close-up Short too (it did a little better than the card Short)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}  # Lyria music and the written descriptions
        run: |
          args="--daily --record --outdir kit"
          [ "$HAS_YT" = "true" ] && args="$args --full"
          python garage-tv/weekly.py $args

      - name: Publish the kit as a release
        if: ${{ !inputs.preview }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(cat kit/TAG)
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          files=(kit/*.zip kit/thumbnail.jpg kit/trailer*.mp4)
          [ -f kit/music.m4a ] && files+=(kit/music.m4a)  # the day's album on its own, to keep
          gh release create "$tag" "${files[@]}" \
            --title "$(cat kit/RELEASE_TITLE)" --notes-file kit/details.txt

      - name: Save today's photo and log it as used
        if: ${{ !inputs.preview }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add garage-tv/published.json garage-tv/stills
          git diff --staged --quiet || (git commit -m "PARKED FM: log $(cat kit/TAG)" && git pull --rebase && git push)

      - name: Upload to YouTube
        if: ${{ !inputs.preview && hashFiles('kit/parked-fm-full.mp4') != '' }}
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'public' }}
        run: |
          # the video and the first Short go public at 8:00 am Eastern, the second Short at 4:00 pm
          python garage-tv/youtube_upload.py kit/parked-fm-full.mp4 kit/thumbnail.jpg kit/details.json --at 08:00 --id-file kit/video_id.txt
          python garage-tv/youtube_upload.py kit/trailer.mp4 - kit/details.json --short --at 08:00 --full-id "$(cat kit/video_id.txt)" --id-file kit/short_id.txt
          # a second Short in the close-up style, only when the build made one (SECOND_SHORT=1)
          if [ -f kit/trailer2.mp4 ]; then
            python garage-tv/youtube_upload.py kit/trailer2.mp4 - kit/details.json --short short2_title --at 16:00 --full-id "$(cat kit/video_id.txt)" --id-file kit/short2_id.txt \
              || echo "::warning::second Short upload failed"
          fi
          python garage-tv/scoreboard.py --log "$(cat kit/TAG)" "$(cat kit/video_id.txt)" "$(cat kit/short_id.txt)" "$(cat kit/short2_id.txt 2>/dev/null)"

      - name: Update the picture-test scoreboard
        if: ${{ !inputs.preview }}
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          python garage-tv/scoreboard.py || echo "::warning::scoreboard refresh failed"
          git add garage-tv/published.json parked-fm/scoreboard.json
          git diff --staged --quiet || (git commit -m "PARKED FM: scoreboard $(cat kit/TAG)" && git pull --rebase && git push)
